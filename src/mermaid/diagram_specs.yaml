# Data-driven Mermaid diagram specifications.
# Each entry becomes one diagram via textbook `mermaid.diagrams`. Add diagrams
# here rather than hard-coding sources, so the catalogue is inspectable and
# testable. `kind` selects the builder; `nodes`/`edges` parameterise it.

diagrams:
  - name: concept_map
    kind: flowchart
    title: "Generic concept map"
    direction: TD
    nodes:
      - {id: A, label: "Inputs / assumptions"}
      - {id: B, label: "Model"}
      - {id: C, label: "Predictions"}
      - {id: D, label: "Comparison with data"}
    edges:
      - {from: A, to: B}
      - {from: B, to: C}
      - {from: C, to: D}
      - {from: D, to: A, label: "revise"}

  - name: process_flow
    kind: flowchart
    title: "Generic process flow"
    direction: LR
    nodes:
      - {id: S, label: "Start"}
      - {id: P, label: "Process"}
      - {id: E, label: "End"}
    edges:
      - {from: S, to: P}
      - {from: P, to: E}

  - name: part_hierarchy
    kind: flowchart
    title: "Book structure hierarchy"
    direction: TD
    nodes:
      - {id: Book, label: "Book"}
      - {id: Part, label: "Part"}
      - {id: Chap, label: "Chapter"}
      - {id: Sec, label: "Section"}
    edges:
      - {from: Book, to: Part}
      - {from: Part, to: Chap}
      - {from: Chap, to: Sec}

  - name: sequence_demo
    kind: sequence
    title: "Generic interaction"
    participants: [Author, Engine, Renderer]
    messages:
      - {from: Author, to: Engine, text: "edit config.yaml"}
      - {from: Engine, to: Renderer, text: "emit manuscript"}
      - {from: Renderer, to: Author, text: "PDF", dashed: true}

  - name: state_demo
    kind: state
    title: "Stub lifecycle"
    transitions:
      - {from: "[*]", to: Stub}
      - {from: Stub, to: Drafted, label: "fill"}
      - {from: Drafted, to: Reviewed, label: "review"}
      - {from: Reviewed, to: "[*]", label: "publish"}

  - name: class_demo
    kind: class
    title: "Engine types"
    classes:
      - name: ChapterRef
        members: ["+str part_id", "+str file", "+stem() str"]
      - name: TocEntry
        members: ["+int number", "+str title"]
    relations:
      - {from: ChapterRef, to: TocEntry, arrow: "-->", label: "numbered as"}

  - name: er_demo
    kind: er
    title: "Book schema"
    relations:
      - {from: PART, to: CHAPTER, cardinality: "||--o{", label: "contains"}
      - {from: CHAPTER, to: LAB, cardinality: "||--||", label: "has"}
    entities:
      - name: PART
        attributes:
          - {type: string, name: id}
          - {type: string, name: title}
      - name: CHAPTER
        attributes:
          - {type: string, name: file}
          - {type: string, name: title}

  - name: gantt_demo
    kind: gantt
    title: "Authoring schedule"
    sections:
      - name: Draft
        tasks:
          - {name: "Outline", id: t1, start: "2026-01-01", duration: "5d"}
          - {name: "First pass", id: t2, start: "2026-01-06", duration: "10d"}
      - name: Review
        tasks:
          - {name: "Edit", id: t3, start: "2026-01-16", duration: "7d"}

  - name: pie_demo
    kind: pie
    title: "Effort by section"
    slices:
      - {label: "Prose", value: 50}
      - {label: "Figures", value: 25}
      - {label: "Tests", value: 25}

  - name: mindmap_demo
    kind: mindmap
    root: "Textbook"
    branches:
      - label: "Manuscript"
        children: ["Chapters", "Labs", "Questions"]
      - label: "Engine"
        children: ["models", "content", "visualization"]

  - name: timeline_demo
    kind: timeline
    title: "Edition history"
    events:
      - {period: "0.1", items: ["Scaffold", "Stubs"]}
      - {period: "1.0", items: ["Filled", "Published"]}

  - name: quadrant_demo
    kind: quadrant
    title: "Prioritising chapters"
    x_axis: "Low effort --> High effort"
    y_axis: "Low value --> High value"
    quadrants: ["Do now", "Plan", "Quick wins", "Defer"]
    points:
      - {label: "Core methods", x: 0.3, y: 0.8}
      - {label: "Frontiers", x: 0.7, y: 0.6}

  - name: journey_demo
    kind: journey
    title: "Reader journey"
    sections:
      - name: "Onboarding"
        steps:
          - {task: "Open book", score: 5, actors: [Reader]}
          - {task: "Read preface", score: 4, actors: [Reader]}
      - name: "Study"
        steps:
          - {task: "Do lab", score: 3, actors: [Reader, Instructor]}

  - name: corpus_map
    kind: flowchart
    title: "Omni-Lattice corpus pipeline"
    direction: TD
    nodes:
      - {id: Ship, label: "Source papers shipped"}
      - {id: Catalog, label: "Engine catalog"}
      - {id: Shelf, label: "Engine shelf (24 papers)"}
      - {id: Companions, label: "Companion volumes"}
      - {id: Textbook, label: "Omni-Lattice textbook"}
    edges:
      - {from: Ship, to: Catalog}
      - {from: Catalog, to: Shelf, label: "papers"}
      - {from: Shelf, to: Companions, label: "synthesis"}
      - {from: Companions, to: Textbook}

  - name: engine_shelf_order
    kind: flowchart
    title: "Engine shelf ordering (positions 1-8)"
    direction: LR
    nodes:
      - {id: P1, label: "CMOS/Protonic"}
      - {id: P2, label: "Tensor Decoupling"}
      - {id: P3, label: "Master Synthesis"}
      - {id: P4, label: "Digits"}
      - {id: P5, label: "Metamorphic"}
      - {id: P6, label: "Planetary Core"}
      - {id: P7, label: "Y-Chromosome"}
      - {id: P8, label: "Invisible Frontier"}
    edges:
      - {from: P1, to: P2}
      - {from: P2, to: P3}
      - {from: P3, to: P4}
      - {from: P4, to: P5}
      - {from: P5, to: P6}
      - {from: P6, to: P7}
      - {from: P7, to: P8}

  - name: octave_register
    kind: flowchart
    title: "Octave register catalog sizing"
    direction: TD
    nodes:
      - {id: Drawers, label: "9 Digit Drawers"}
      - {id: Bands, label: "99 Octave Bands"}
      - {id: Register, label: "Master Register"}
      - {id: Size, label: "8019 catalog size"}
    edges:
      - {from: Drawers, to: Bands}
      - {from: Bands, to: Register}
      - {from: Register, to: Size}

  - name: rhyme_combination
    kind: flowchart
    title: "Multi-dimensional rhyme composition"
    direction: LR
    nodes:
      - {id: Pillar, label: "Four-Pillar Rhyme"}
      - {id: Diagonal, label: "xD±yD"}
      - {id: Multi, label: "Multi-Dimensional Rhyme"}
    edges:
      - {from: Pillar, to: Multi}
      - {from: Diagonal, to: Multi}

  - name: transduction_line
    kind: flowchart
    title: "Non-local to local transduction line"
    direction: LR
    nodes:
      - {id: Idea, label: "Non-local ideation"}
      - {id: Bridge, label: "c-bridge (impedance match)"}
      - {id: Drag, label: "Self-observation drag"}
      - {id: Mass, label: "Localized mass"}
    edges:
      - {from: Idea, to: Bridge}
      - {from: Bridge, to: Drag}
      - {from: Drag, to: Mass}

  - name: metrological_overlap
    kind: state
    title: "Unit systems converging on one metrology"
    transitions:
      - {from: "[*]", to: Units}
      - {from: Units, to: Overlap, label: "compare instruments"}
      - {from: Overlap, to: Unified, label: "agree standards"}
      - {from: Unified, to: "[*]"}

  - name: net_zero_ledger
    kind: flowchart
    title: "Net-zero ledger balance"
    direction: TD
    nodes:
      - {id: In, label: "Inflows"}
      - {id: Out, label: "Outflows"}
      - {id: Residual, label: "Residual = 0"}
      - {id: Crystal, label: "Net Zero Crystal"}
    edges:
      - {from: In, to: Residual}
      - {from: Out, to: Residual}
      - {from: Residual, to: Crystal}

  - name: lattice_linear_gateway
    kind: flowchart
    title: "Lattice-linear gateway (PDVSA companion)"
    direction: LR
    nodes:
      - {id: Field, label: "Source field"}
      - {id: Transport, label: "Lattice-linear transport"}
      - {id: Gateway, label: "Gateway ops"}
    edges:
      - {from: Field, to: Transport}
      - {from: Transport, to: Gateway}

  - name: set_recycling_cycle
    kind: state
    title: "Set recycling lifecycle"
    transitions:
      - {from: "[*]", to: Active, label: "allocate"}
      - {from: Active, to: Parked, label: "idle"}
      - {from: Parked, to: Recycled, label: "collect"}
      - {from: Recycled, to: Active, label: "reuse"}

  - name: pem_lifecycle
    kind: journey
    title: "Paper-engineering module journey"
    sections:
      - name: "Engineer"
        steps:
          - {task: "File a paper", score: 5, actors: [Author]}
          - {task: "Wire reference implementation", score: 4, actors: [Author, Engineer]}
          - {task: "Run fixture suite", score: 4, actors: [Engineer]}
          - {task: "Pin to engine shelf", score: 5, actors: [Author, Engineer]}

  - name: honesty_tier_flow
    kind: flowchart
    title: "Honesty tiers meet Fair Exchange disclosure"
    direction: TD
    nodes:
      - {id: Narrative, label: "Narrative tier"}
      - {id: Empirical, label: "Empirical tier"}
      - {id: Operational, label: "Operational tier"}
      - {id: Disclosure, label: "Fair Exchange disclosure"}
      - {id: Reader, label: "Reader"}
    edges:
      - {from: Narrative, to: Disclosure, label: "stories, framing, cover art"}
      - {from: Empirical, to: Disclosure, label: "counts, tables, pinned constants"}
      - {from: Operational, to: Disclosure, label: "fixtures, suite locks, npm run"}
      - {from: Disclosure, to: Reader, label: "disclosed scope"}

  - name: octave_convention_decision
    kind: flowchart
    title: "Octave convention: exponent vs subscript"
    direction: TD
    nodes:
      - {id: Printed, label: "Printed shorthand Ωn = Φn·Ω0"}
      - {id: Exponent, label: "Exponent reading Φ^n·Ω0"}
      - {id: Subscript, label: "Subscript reading φ_fib(n)·Ω0"}
      - {id: Register, label: "Octave register"}
    edges:
      - {from: Printed, to: Exponent, label: "n read as superscript"}
      - {from: Printed, to: Subscript, label: "n read as index"}
      - {from: Exponent, to: Register, label: "Φ^n spacing"}
      - {from: Subscript, to: Register, label: "Fibonacci-ratio spacing"}

  - name: digit_drawer_map
    kind: flowchart
    title: "Digit drawers to 8,019 addresses"
    direction: LR
    nodes:
      - {id: Drawers, label: "9 digit drawers"}
      - {id: Register, label: "Master register"}
      - {id: Bands, label: "99 octave bands"}
      - {id: Catalog, label: "Catalog size 8,019"}
    edges:
      - {from: Drawers, to: Register, label: "digit rows"}
      - {from: Register, to: Bands, label: "octave columns"}
      - {from: Bands, to: Catalog, label: "99 × 81 = 8,019"}

  - name: engine_shelf_full
    kind: flowchart
    title: "Engine shelf grouped 1-8, 9-16, 17-24"
    direction: LR
    nodes:
      - {id: S1_8, label: "Shelf 1-8 · CMOS/Protonic · Tensor Decoupling · Master Synthesis · Digits · Metamorphic Octaves · Planetary Core · Y-Chromosome · Invisible Frontier"}
      - {id: S9_16, label: "Shelf 9-16 · Reality Bridge · Higgs Awareness · Prime Parity · Moving Up the Stack · Stack Valuation · Protein Folding · Volumetric Storage · Proton Theater"}
      - {id: S17_24, label: "Shelf 17-24 · Topology of the Void · Holographic Rhyme · Multidimensional Rhyme · Singularity Crystal · Kinematic Set-Recycling · Eddy-Current Mirror · Metrological Overlap · Viscosity of Light"}
    edges:
      - {from: S1_8, to: S9_16}
      - {from: S9_16, to: S17_24}

  - name: pdvsa_three_zone
    kind: flowchart
    title: "PDVSA gateway three-zone topology"
    direction: LR
    nodes:
      - {id: Up, label: "Upstream zone (plant enclosure)"}
      - {id: Gather, label: "Gather"}
      - {id: Decide, label: "Decide"}
      - {id: Act, label: "Act"}
      - {id: Down, label: "Downstream zone (partner boundary)"}
    edges:
      - {from: Up, to: Gather, label: "summaries out"}
      - {from: Gather, to: Decide, label: "one shared brief"}
      - {from: Decide, to: Act, label: "nine takeaways"}
      - {from: Act, to: Down, label: "summaries only"}
      - {from: Down, to: Up, label: "token-bound feedback"}

  - name: pem_runtime_chain
    kind: sequence
    title: "PEM runtime chain"
    participants: [Reader, LatticeChat, PEMPin, Whitepaper, Implementation, Fixtures]
    messages:
      - {from: Reader, to: LatticeChat, text: "open lattice chat workstream"}
      - {from: LatticeChat, to: PEMPin, text: "request engine-shelf pin"}
      - {from: PEMPin, to: Whitepaper, text: "surface whitepaper"}
      - {from: Whitepaper, to: Implementation, text: "reference implementation (npm run)"}
      - {from: Implementation, to: Fixtures, text: "run fixture suite"}
      - {from: Fixtures, to: Reader, text: "suite locks 9/9", dashed: true}

  - name: net_zero_crystal
    kind: state
    title: "Net-zero crystal"
    transitions:
      - {from: Inflows, to: Crystal, label: "converge"}
      - {from: Crystal, to: Outflows, label: "residual = 0"}
      - {from: Outflows, to: "[*]", label: "crystal complete"}

  - name: research_program
    kind: mindmap
    root: "Open problems"
    branches:
      - label: "Consistency audits"
        children: ["octave convention", "overlap census"]
      - label: "Automation"
        children: ["net-zero ledger"]
      - label: "Theses"
        children: ["stack layer", "invisible frontier", "cascade grammar", "crystal diagnostic"]

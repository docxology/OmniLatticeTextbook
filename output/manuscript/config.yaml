# The Infinite Octaves Omni-Lattice Textbook — Manuscript Configuration
# =============================================================================
# Single source of truth for the book's structure. Everything downstream — the
# table of contents, chapter auto-numbering, figure generation, lab/question
# wiring, and manuscript-integrity tests — reads THIS file. To grow the book,
# add parts and chapters here, then run `scripts/scaffold_chapter.py` to
# materialise any missing stub files in the correct shape.
#
# SECTIONS:
#   book:         Bibliographic metadata (title, author, edition, license)
#   authors:      Full author list with affiliations
#   publication:  DOI, repository, keywords
#   analysis:     Build-producing scripts run by pipeline Stage 02 (in order)
#   layout:       Page geometry
#   typography:   Fonts, link colour, sizes
#   front_matter: Front-matter files and ordering
#   rendering:    Chapter/figure/equation auto-numbering
#   units:        Part order and the chapters inside each part (THE STRUCTURE;
#                 the key is `units:`, also accepted as `parts:`)
#   appendices:   Labs, question banks, and reference appendices
# =============================================================================

book:
  title: "The Infinite Octaves Omni-Lattice Textbook"
  subtitle: "A Modular Synthesis of the SynthOBS Engine Papers"
  author: "Prudencio Mendez"
  orcid: ""
  edition: "0.1"
  version: "0.1.0"  # software/deposit version — matches CITATION.cff and .zenodo.json
  year: 2026
  language: "en"
  license: "CC BY 4.0"
  code_license: "Apache-2.0"
  cover:
    image: "assets/cover/omnilattice_cover.png"
    alt: "Deterministic cover art for the Infinite Octaves Omni-Lattice: a lattice of ninety-nine octave bands keyed by the golden-ratio constant, with nine digit drawers and the zero-octave node at the origin."

authors:
  - name: "Prudencio Mendez"
    orcid: ""
    email: ""
    affiliation: "SS Vibelandia · SynthOBS Autonomous Agent Program"
    corresponding: true

publication:
  doi: ""  # DOI assigned at first deposit
  version_doi: ""  # DOI assigned at first deposit
  version_record: ""  # DOI assigned at first deposit
  repository_url: "https://github.com/docxology/OmniLatticeTextbook"
  repository_label: "Source repository"
  github_repository: "docxology/OmniLatticeTextbook"
  published_artifacts: {}
  # Deposit abstract: this book uses a front_matter/preface structure rather
  # than a 00_abstract.md, so supply the Zenodo description explicitly.
  zenodo_description: "A modular textbook synthesis of the Infinite Octaves Omni-Lattice engine papers (SynthOBS, SS Vibelandia): the 99-octave digit map, prime-parity and golden-ratio formalisms, holographic rhyme, the physical engine shelf, and the engineering companions — presented with worked, tested formalisms, deterministic figures, labs, and question banks."
  keywords:
    - "open textbook"
    - "Infinite Octaves"
    - "Omni-Lattice"
    - "SynthOBS"
    - "catalog architecture"
    - "golden ratio"
    - "prime parity"
    - "holographic rhyme"

# ---------------------------------------------------------------------------
# ANALYSIS ORCHESTRATION
# Stage 02 runs only these build-producing scripts, in this order. Maintenance
# scripts (audit_*, scaffold_chapter) stay callable by hand but are excluded so
# rendering is reproducible and non-mutating.
# ---------------------------------------------------------------------------
analysis:
  scripts:
    - generate_figures.py
    - generate_diagrams.py
    - analysis.py

# ---------------------------------------------------------------------------
# PAGE LAYOUT  (mm unless noted; adjust here only)
# ---------------------------------------------------------------------------
layout:
  page_size: "letter"      # letter | a4 | a5
  margin_top_mm: 18
  margin_bottom_mm: 18
  margin_left_mm: 18
  margin_right_mm: 18
  margin_inner_extra_mm: 0 # set 6-10 for printed binding
  line_height: 1.3
  text_width_fraction: 0.92

# ---------------------------------------------------------------------------
# TYPOGRAPHY
# ---------------------------------------------------------------------------
typography:
  body_font: "Linux Libertine O"
  heading_font: "Linux Biolinum O"
  mono_font: "DejaVu Sans Mono"
  base_font_size_pt: 10
  link_color: "#1A5276"
  link_color_internal: "#1A5276"
  link_color_external: "#1A5276"
  link_underline: true

# ---------------------------------------------------------------------------
# FRONT MATTER
# ---------------------------------------------------------------------------
front_matter:
  files:
    - file: front_matter.md
      title: "Front Matter"
    - file: preface.md
      title: "Preface"
  page_two_quote:
    text: "“The map is for coordination, not cosmic destiny.”"
    attribution: "Prudencio Mendez — SS Vibelandia ship blog, “Nine Digits, Ninety-Nine Octaves”"
  page_two_acknowledgements:
    title: "Acknowledgements"
    text: "This textbook synthesises the Infinite Octaves Omni-Lattice engine papers catalogued aboard the SS Vibelandia (ssvibelandiaquestfest24x365.com), written by Prudencio Mendez and operated by the SynthOBS Autonomous Agent. The Fair Exchange honesty clauses of the source papers are preserved throughout."
  include_front_matter: true
  include_preface: true

# ---------------------------------------------------------------------------
# RENDERING / NUMBERING
# ---------------------------------------------------------------------------
rendering:
  number_chapters: true
  number_figures: true
  number_equations: true
  number_tables: true
  toc_depth: 2

# Output formats (infrastructure/rendering reads render.formats). The book
# renders to PDF (via XeLaTeX + the preamble), plus HTML, EPUB, and DOCX, which
# are LaTeX-free and portable. Per-file Beamer slide decks are OFF by default.
render:
  formats:
    pdf: true
    html: true
    epub: true
    docx: true
    slides: false

# Manuscript-facing teaching-time defaults. They are declared here so duration
# badges remain configuration-backed facts rather than unexplained literals.
project_config:
  pedagogy:
    default_lecture_minutes: 45
    worked_chapter_read_minutes: 40
    default_lab_minutes: 60
    extended_case_study_lab_minutes: 75
  evidence:
    numeric_fact_registry: data/numeric_facts.yaml
    diagram_specs: src/mermaid/diagram_specs.yaml

# ---------------------------------------------------------------------------
# UNITS (a.k.a. parts) — the structure. Chapters number sequentially across the
# whole book. The live key is `units:` (the loader also accepts `parts:`).
# Add a part: append a block here + a directory under manuscript/.
# Skip a chapter without deleting it: add `enabled: false` to its entry.
#
# Every engine-shelf paper of the corpus maps to exactly one chapter, except:
#   - Holographic Singularity Crystal + Node k=0 (one chapter, two sections);
#   - PDVSA Gateway Ops live page + mockup note (one chapter, two sources);
#   - framework pages (ship home, catalog, Living PEM) feed the Part 0
#     orientation and Living PEM chapters.
# Synthesis chapters (fractal-constant, frontiers) are analytic, source-backed
# integrations and cite the papers they synthesise.
# ---------------------------------------------------------------------------
units:
  - id: part_0
    title: "Orientation and Methods"
    label: "0"
    directory: part_0
    intro_file: unit_intro.md
    chapters:
      - file: orientation.md
        title: "The SS Vibelandia Program and the Omni-Lattice Corpus"
      - file: living-pem.md
        title: "The Living PEM: Engineering the Lattice"
      - file: tensor-decoupling.md
        title: "Tensor Decoupling: Filing the Engine"
      - file: master-synthesis.md
        title: "Master Synthesis: Everything Is Connected"
      - file: octave-map.md
        title: "Nine Digits, Ninety-Nine Octaves"

  - id: part_I
    title: "Foundations: Constants, Primes, and Rhyme"
    label: "I"
    directory: part_I
    intro_file: unit_intro.md
    chapters:
      - file: fractal-constant.md
        title: "El Gran Sol's Fractal Constant"
      - file: prime-parity.md
        title: "Prime-Parity: The Sole-Even Anchor"
      - file: holographic-rhyme.md
        title: "Holographic Rhyme: The Four-Pillar Fractal"
      - file: multidimensional-rhyme.md
        title: "Multi-Dimensional Holographic Rhyme"
      - file: topology-void.md
        title: "Topology of the Void: Zero as Equilibrium"
      - file: higgs-awareness.md
        title: "The Higgs Gate: Mass and the Shared Now"

  - id: part_II
    title: "Core Systems: The Physical Engine Shelf"
    label: "II"
    directory: part_II
    intro_file: unit_intro.md
    chapters:
      - file: proton-theater.md
        title: "Proton Space, Electron Theater, and Φ Duality"
      - file: viscosity-light.md
        title: "The Viscosity of Light"
      - file: eddy-current-mirror.md
        title: "The Eddy-Current Mirror: Transduction Drag"
      - file: crystalline-field.md
        title: "The Crystalline Unified Field: Speed and Distance"
      - file: metrological-overlap.md
        title: "The Grand Unified Metrological Overlap"
      - file: metamorphic-octaves.md
        title: "Metamorphic Octaves: Densification"
      - file: planetary-core.md
        title: "Planetary Core and the Goldilocks Bands"
      - file: singularity-crystal.md
        title: "The Holographic Singularity Crystal: Net Zero and Node k = 0"

  - id: part_III
    title: "Implementations, Companions, and Frontiers"
    label: "III"
    directory: part_III
    intro_file: unit_intro.md
    chapters:
      - file: cmos-protonic.md
        title: "CMOS/Protonic: The Silicon Shelf"
      - file: protein-folding.md
        title: "Protein Folding as Prime-Container Architecture"
      - file: volumetric-storage.md
        title: "Prime-Indexed Volumetric Storage"
      - file: kinematic-recycling.md
        title: "Kinematic Set-Recycling: The Truckee Protocol"
      - file: moving-up-stack.md
        title: "Moving Up the Stack: Lattice as the Next AI Layer"
      - file: reality-bridge.md
        title: "Humans as Omniversal Reality Bridges"
      - file: y-chromosome.md
        title: "Y-Chromosome Manifestation: Digit 4"
      - file: pdvsa-gateway.md
        title: "PDVSA Gateway Ops: The EGS Lattice-Linear Companion"
      - file: macro-protein.md
        title: "The Macro-Protein Work Engine"
      - file: invisible-frontier.md
        title: "The Invisible Frontier"
      - file: frontiers.md
        title: "Frontiers and the Research Program"

